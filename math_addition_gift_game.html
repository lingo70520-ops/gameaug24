<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>限時45秒！數學加法解鎖禮物大挑戰</title>
    <!-- Tailwind CSS for modern responsive styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts for playful typography -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
    <!-- Confetti library for celebration effects -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body {
            font-family: 'Noto Sans TC', 'Fredoka One', cursive, sans-serif;
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            min-height: 100vh;
        }

        @keyframes bounce-slow {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .animate-bounce-slow {
            animation: bounce-slow 2s infinite ease-in-out;
        }

        @keyframes pop-in {
            0% { transform: scale(0); opacity: 0; }
            80% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        .animate-pop {
            animation: pop-in 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }

        .animate-shake {
            animation: shake 0.4s ease-in-out;
        }

        @keyframes pulse-ring {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }

        .timer-pulse {
            animation: pulse-ring 1s infinite;
        }
    </style>
</head>
<body class="flex items-center justify-center p-4">

    <div class="bg-white/95 backdrop-blur-md rounded-3xl shadow-2xl p-6 sm:p-10 w-full max-w-md text-center border-4 border-white relative overflow-hidden">
        
        <!-- START SCREEN -->
        <div id="start-screen" class="space-y-6 py-4">
            <div class="text-6xl animate-bounce-slow">⏱️🎁✨</div>
            <h1 class="text-2xl sm:text-3xl font-black text-indigo-600 drop-shadow-sm">
                45秒數學禮物大挑戰
            </h1>
            <p class="text-gray-500 text-sm sm:text-base leading-relaxed">
                在 45 秒內盡情回答加法題目！答對越多題，就能解鎖越多神祕禮物，快來挑戰最高紀錄吧！
            </p>
            <button 
                onclick="startGame()"
                class="w-full bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white font-black text-xl py-4 rounded-2xl shadow-lg transform active:scale-95 transition cursor-pointer">
                🚀 開始挑戰 45 秒！
            </button>
        </div>

        <!-- GAMEPLAY SCREEN (Hidden initially) -->
        <div id="game-screen" class="hidden">
            <!-- Timer & Score Header -->
            <div class="flex justify-between items-center mb-5 px-1">
                <div id="timer-badge" class="bg-rose-100 text-rose-700 font-black px-4 py-2 rounded-full shadow-sm text-sm sm:text-base flex items-center gap-1">
                    ⏳ <span id="time-left">45</span>秒
                </div>
                <div class="bg-amber-100 text-amber-800 font-bold px-4 py-2 rounded-full shadow-sm text-sm sm:text-base">
                    🎯 答對：<span id="correct-count">0</span> 題
                </div>
            </div>

            <!-- Math Question Box -->
            <div class="bg-gradient-to-r from-indigo-500 to-purple-500 text-white rounded-2xl py-6 px-4 mb-6 shadow-md transform transition hover:scale-102 duration-300">
                <div class="text-4xl sm:text-5xl font-black tracking-wider" id="question-text">
                    12 + 8 = ?
                </div>
            </div>

            <!-- Input and Submit Form -->
            <form id="game-form" onsubmit="handleAnswer(event)" class="space-y-4">
                <div class="relative">
                    <input 
                        type="number" 
                        id="answer-input" 
                        autocomplete="off"
                        placeholder="輸入答案..." 
                        class="w-full text-center text-3xl font-bold py-3 px-4 rounded-2xl border-4 border-indigo-200 focus:border-indigo-500 focus:outline-none shadow-inner bg-gray-50 text-gray-700 placeholder-gray-300 transition"
                        required
                    >
                </div>
                <button 
                    type="submit" 
                    class="w-full bg-gradient-to-r from-pink-500 to-rose-500 hover:from-pink-600 hover:to-rose-600 text-white font-bold text-xl py-4 rounded-2xl shadow-lg transform active:scale-95 transition cursor-pointer">
                    ✨ 送出答案
                </button>
            </form>

            <!-- Feedback Area -->
            <div id="feedback-area" class="mt-4 min-h-[70px] flex flex-col items-center justify-center">
                <p id="feedback-msg" class="text-gray-600 font-medium text-lg"></p>
            </div>
        </div>

        <!-- GAMEOVER SCREEN (Hidden initially) -->
        <div id="gameover-screen" class="hidden space-y-5 py-4">
            <div class="text-6xl animate-bounce-slow">🏆🎉</div>
            <h2 class="text-2xl sm:text-3xl font-black text-indigo-600">
                時間到！挑戰結束！
            </h2>
            <div class="bg-indigo-50 rounded-2xl p-5 space-y-2 border-2 border-indigo-100">
                <p class="text-gray-600 text-base">你總共答對了：</p>
                <div class="text-4xl font-black text-purple-600">
                    <span id="final-correct">0</span> 題
                </div>
                <div id="unlocked-gifts-container" class="mt-3 pt-3 border-t border-indigo-200">
                    <p class="text-xs text-gray-500 mb-2 font-bold">解鎖獲得的驚喜禮物牆：</p>
                    <div id="gifts-grid" class="flex flex-wrap justify-center gap-2 max-h-32 overflow-y-auto p-1">
                        <!-- Dynamic gift icons -->
                    </div>
                </div>
            </div>
            <button 
                onclick="restartGame()"
                class="w-full bg-gradient-to-r from-pink-500 to-rose-500 hover:from-pink-600 hover:to-rose-600 text-white font-black text-xl py-4 rounded-2xl shadow-lg transform active:scale-95 transition cursor-pointer">
                🔄 再玩一次
            </button>
        </div>

    </div>

    <script>
        // Game State Variables
        let num1 = 0;
        let num2 = 0;
        let correctAnswer = 0;
        let correctCount = 0;
        let timeLeft = 45;
        let timerInterval = null;
        let isGameActive = false;
        let earnedGifts = [];

        // List of fun gift emojis and names
        const giftList = [
            { emoji: '🧸', name: '泰迪熊' },
            { emoji: '🎮', name: '遊戲機' },
            { emoji: '🚀', name: '火箭' },
            { emoji: '🦄', name: '獨角獸' },
            { emoji: '🎨', name: '畫筆' },
            { emoji: '⚽', name: '足球' },
            { emoji: '👑', name: '皇冠' },
            { emoji: '🍩', name: '甜甜圈' },
            { emoji: '⭐', name: '星星' },
            { emoji: '🎧', name: '耳機' }
        ];

        // Start the game session
        function startGame() {
            correctCount = 0;
            timeLeft = 45;
            earnedGifts = [];
            isGameActive = true;

            document.getElementById('correct-count').innerText = '0';
            document.getElementById('time-left').innerText = timeLeft;
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('gameover-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');

            generateQuestion();
            document.getElementById('answer-input').focus();

            // Start 45-second countdown timer
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('time-left').innerText = timeLeft;

                if (timeLeft <= 10) {
                    document.getElementById('timer-badge').classList.add('timer-pulse');
                }

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    endGame();
                }
            }, 1000);
        }

        // Generate a random addition question
        function generateQuestion() {
            num1 = Math.floor(Math.random() * 25) + 1;
            num2 = Math.floor(Math.random() * 25) + 1;
            correctAnswer = num1 + num2;

            document.getElementById('question-text').innerText = `${num1} + ${num2} = ?`;
            document.getElementById('answer-input').value = '';
            document.getElementById('feedback-msg').innerText = '';
        }

        // Handle user answer submission
        function handleAnswer(event) {
            event.preventDefault();
            if (!isGameActive) return;

            const userInputValue = document.getElementById('answer-input').value;
            if (userInputValue === '') return;

            const userAnswer = parseInt(userInputValue, 10);
            const feedbackArea = document.getElementById('feedback-area');
            const formCard = document.querySelector('.bg-white\\/95');

            if (userAnswer === correctAnswer) {
                // Correct Answer
                correctCount++;
                document.getElementById('correct-count').innerText = correctCount;

                // Pick a random gift
                const randomGift = giftList[Math.floor(Math.random() * giftList.length)];
                earnedGifts.push(randomGift);

                // Trigger confetti celebration
                if (typeof confetti === 'function') {
                    confetti({
                        particleCount: 50,
                        spread: 60,
                        origin: { y: 0.6 }
                    });
                }

                // Display success prompt briefly
                feedbackArea.innerHTML = `
                    <div class="animate-pop flex items-center gap-2 bg-emerald-50 text-emerald-700 px-4 py-2 rounded-xl border border-emerald-200">
                        <span class="text-2xl">${randomGift.emoji}</span>
                        <span class="font-bold text-sm">答對！解鎖 ${randomGift.name}！</span>
                    </div>
                `;

                // Generate next question immediately
                setTimeout(() => {
                    if (isGameActive) {
                        generateQuestion();
                    }
                }, 600);

            } else {
                // Incorrect Answer
                formCard.classList.add('animate-shake');
                setTimeout(() => {
                    formCard.classList.remove('animate-shake');
                }, 400);

                feedbackArea.innerHTML = `
                    <p class="text-rose-500 font-bold text-sm animate-pulse">
                        哎呀！算錯囉，再試一次！💪
                    </p>
                `;

                const inputField = document.getElementById('answer-input');
                inputField.value = '';
                inputField.focus();
            }
        }

        // End the game when time runs out
        function endGame() {
            isGameActive = false;
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('timer-badge').classList.remove('timer-pulse');
            document.getElementById('final-correct').innerText = correctCount;

            // Render earned gifts grid
            const giftsGrid = document.getElementById('gifts-grid');
            giftsGrid.innerHTML = '';

            if (earnedGifts.length === 0) {
                giftsGrid.innerHTML = '<p class="text-xs text-gray-400">這次沒有解鎖到禮物，加油再試一次！</p>';
            } else {
                earnedGifts.forEach(gift => {
                    const span = document.createElement('span');
                    span.className = 'text-2xl bg-white p-1 rounded-lg shadow-sm border border-indigo-100 animate-pop';
                    span.title = gift.name;
                    span.innerText = gift.emoji;
                    giftsGrid.appendChild(span);
                });
            }

            document.getElementById('gameover-screen').classList.remove('hidden');

            // Big Celebration
            if (correctCount > 0 && typeof confetti === 'function') {
                confetti({
                    particleCount: 120,
                    spread: 100,
                    origin: { y: 0.5 }
                });
            }
        }

        // Restart game flow
        function restartGame() {
            startGame();
        }
    </script>
</body>
</html>
